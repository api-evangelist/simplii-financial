name: Simplii Financial
kind: company
description: >-
  Simplii Financial is the no-fee direct banking brand of the Canadian Imperial
  Bank of Commerce (CIBC), one of Canada's Big Six Schedule I domestic banks.
  Launched November 1, 2017, Simplii succeeded CIBC's two-decade President's
  Choice Financial (PC Financial) co-venture with Loblaws, migrating roughly two
  million accounts to the new brand. Simplii is not a separately chartered bank;
  it operates as a division and trade name of CIBC under CIBC's Schedule I federal
  charter, offering no-fee daily chequing and savings, mortgages, personal loans,
  lines of credit, GICs, mutual funds, and USD accounts through online, mobile,
  and telephone channels only (no branches), with CDIC deposit insurance provided
  through CIBC. On open finance, Simplii exposes no first-party public developer
  API or developer portal; consumer financial-data access today is aggregator- and
  screen-scraping-based via Plaid, Finicity, and MX (CIBC signed a data-access
  agreement with MX), consistent with Canada's voluntary, pre-mandate posture
  while the federal Consumer-Driven Banking framework (Budget 2024 / FES 2024,
  overseen by the FCAC) is legislated but not yet operational.
